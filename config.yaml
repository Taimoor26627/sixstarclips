# Six Star Clips - automation settings
# Edit this file on GitHub (pencil icon) to change what the bot does.

channel:
  name: "Six Star Clips"
  handle: "@SixStarClipsGG1"

game_name: "Grand Theft Auto VI"   # Twitch category to clip from

selection:
  # Proven moments first: the most-viewed GTA 6 clips of the last month, not just the newest.
  lookback_hours: 720              # clips made in the last 30 days
  half_life_hours: 168             # a week-old clip needs 2x the views of a new one to win
  min_views: 500                   # skip Twitch clips with fewer views
  max_game_checks: 60              # how many top clips to check are really GTA 6
  min_duration: 8                  # seconds
  max_per_streamer_per_day: 2      # spread posts across streamers
  posts_per_run: 1                 # each scheduled run posts this many
  youtube_lookback_hours: 720      # YouTube: most-viewed GTA 6 streams of the last 30 days
  youtube_peak_weight: 40000       # how strongly YouTube "most replayed" peaks compete with Twitch clips

research:
  # Learning loop (uses the Make scenario's read-only YouTube route, ~4 Make operations per call).
  stats_every_hours: 44            # re-read our Shorts' views about every 2 days (1 call)
  market_every_days: 10            # re-research each streamer's audience (~20 calls)

schedule:
  # One run makes the whole day's clips and schedules them on YouTube at these times.
  per_day: 6
  utc_offset_hours: 5              # Pakistan time
  slots: ["01:00", "05:00", "09:00", "13:00", "17:00", "21:00"]   # go-live times (your time)

publish:
  # YouTube auto-upload. Keep false until YouTube's API audit is approved:
  # before that, API uploads are locked private forever and can't be fixed.
  youtube: false
  privacy: "public"                # public | unlisted | private
  # Telegram: each finished clip + title + description lands on your phone,
  # ready to share to YouTube / TikTok / Instagram / X in a few taps.
  telegram: true
  # Make: auto-upload to YouTube through your Make.com scenario (no API audit needed).
  # Needs the MAKE_WEBHOOK_URL secret. Uses a lighter 720p copy (Make free plan = 5 MB files).
  make: true

render:
  fps: 30
  crf: 21
  max_seconds: 45                # shorter = sharper under the 5 MB upload cap

captions:
  enabled: true
  model: "small"                   # tiny | base | small (small = best on free runners)
  censor_profanity: true

hooks:
  use_claude: true                 # only used if a Claude token secret is set
  # Fallback hooks when a Twitch clip title is junk. {name} = streamer name.
  templates:
    - "{name} was NOT ready for this"
    - "{name} can't believe what just happened"
    - "this is why {name} is banned from Leonida"
    - "{name} completely lost it in GTA 6"
    - "nobody warned {name} about this"
    - "{name} vs the GTA 6 police"
    - "chat saw it before {name} did"
    - "{name}'s worst GTA 6 moment yet"
    - "{name} broke GTA 6"
    - "the moment {name} gave up"

# Clips you want posted next, in order (Twitch clip links). Already-posted ones are skipped.
queue: []
#  - login: kaicenat
#    url: "https://www.twitch.tv/<streamer>/clip/<clip-id>"
#    title: "Optional title"

# Words that suggest a story spoiler. Rockstar takes spoilers down, so skip.
spoiler_words: [ending, "final mission", credits, spoiler, "last mission", "true ending", "dies", "death of", "plot twist"]

