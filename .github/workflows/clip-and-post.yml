name: Make today's clips

on:
  # Optional manual run: Actions > Make today's clips > Run workflow.
  workflow_dispatch:
    inputs:
      count:
        description: "How many Shorts to make and schedule"
        default: "6"
      dry_run:
        description: "Render only (no YouTube, no Telegram)"
        type: boolean
        default: false
  schedule:
    # Every ~4 hours: send "LIVE NOW" alerts, then top the YouTube schedule back up
    # to a full day of Shorts so no slot is ever empty.
    - cron: "4 0,4,8,12,16,20 * * *"
  push:
    # Lets Claude start a run on request by changing trigger/run-now.txt.
    branches: [main]
    paths: ["trigger/**"]

permissions:
  contents: write

concurrency:
  group: clipper
  cancel-in-progress: false

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Deno (yt-dlp needs it for YouTube)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Python packages
        run: pip install -U -r requirements.txt

      - name: Cache caption model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Install Claude Code (only if a Claude token is set)
        if: ${{ env.HAS_CLAUDE == 'true' }}
        run: npm install -g @anthropic-ai/claude-code

      - name: Make and schedule clips
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m clipper learn || true
            python -m clipper run --batch --max-posts "${{ github.event.inputs.count || '6' }}" \
              ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          elif [ "${{ contains(github.event.head_commit.message, '[dry-run]') }}" = "true" ]; then
            python -m clipper run --batch --max-posts 3 --dry-run
          else
            python -m clipper tick
          fi

      - name: Keep the rendered clips for 3 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clips-${{ github.run_id }}
          path: out/*.mp4
          retention-days: 3
          if-no-files-found: ignore

      - name: Save what was posted
        if: always()
        run: |
          git config user.name "clip-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state reports || true
          git diff --cached --quiet || (git commit -m "Update posted clips and learning data" && git pull --rebase && git push)
