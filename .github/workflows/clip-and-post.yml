name: Clip and post

on:
  schedule:
    # Every 30 minutes (48 runs a day). Each run posts `posts_per_run` clips from config.yaml.
    - cron: "4,34 * * * *"
  push:
    # Also run right away whenever the settings or this schedule change.
    branches: [main]
    paths: ["config.yaml", ".github/workflows/clip-and-post.yml"]
  workflow_dispatch:
    inputs:
      max_posts:
        description: "How many clips to make this run"
        default: "1"
      dry_run:
        description: "Render only (no YouTube, no Telegram)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: clipper
  cancel-in-progress: false

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Cache caption model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Install Claude Code (only if a Claude token is set)
        if: ${{ env.HAS_CLAUDE == 'true' }}
        run: npm install -g @anthropic-ai/claude-code

      - name: Find, render and publish clips
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          python -m clipper run --max-posts "${{ github.event.inputs.max_posts || '0' }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Keep the rendered clips for 3 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clips-${{ github.run_id }}
          path: out/*.mp4
          retention-days: 3
          if-no-files-found: ignore

      - name: Save what was posted
        if: always()
        run: |
          git config user.name "clip-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state || true
          git diff --cached --quiet || (git commit -m "Update posted clips" && git pull --rebase && git push)
