name: Make today's clips

on:
  # Run this ONCE a day (Actions > Make today's clips > Run workflow). It makes the
  # day's Shorts, schedules each on YouTube at the go-live times in config.yaml,
  # and sends you one Telegram message with the plan.
  workflow_dispatch:
    inputs:
      count:
        description: "How many Shorts to make and schedule"
        default: "6"
      dry_run:
        description: "Render only (no YouTube, no Telegram)"
        type: boolean
        default: false
  schedule:
    # Only sends "LIVE NOW" alerts a few minutes after each go-live time. It never posts.
    - cron: "4 0,4,8,12,16,20 * * *"

permissions:
  contents: write

concurrency:
  group: clipper
  cancel-in-progress: false

jobs:
  clip:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Cache caption model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Install Claude Code (only if a Claude token is set)
        if: ${{ env.HAS_CLAUDE == 'true' }}
        run: npm install -g @anthropic-ai/claude-code

      - name: Find, render and publish clips
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          python -m clipper run --batch --max-posts "${{ github.event.inputs.count || '6' }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Keep the rendered clips for 3 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clips-${{ github.run_id }}
          path: out/*.mp4
          retention-days: 3
          if-no-files-found: ignore

      - name: Save what was posted
        if: always()
        run: |
          git config user.name "clip-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state || true
          git diff --cached --quiet || (git commit -m "Update posted clips" && git pull --rebase && git push)

  alerts:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests PyYAML
      - name: Send "live now" alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m clipper alerts
      - name: Save alert status
        run: |
          git config user.name "clip-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git diff --cached --quiet || (git commit -m "Live alerts sent" && git pull --rebase && git push)
